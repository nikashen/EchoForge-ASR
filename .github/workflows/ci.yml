name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,serve]"
      - run: python -m pytest
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m mypy src/echoforge
      - run: python scripts/build_pages.py --output dist/pages
      - run: node --check src/echoforge/web/app.js
      - run: node --check src/echoforge/web/pcm-worklet.js
      - run: python -m compileall -q src scripts
      - run: python -m build
      - shell: bash
        run: |
          python -m venv /tmp/echoforge-wheel-smoke
          /tmp/echoforge-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/echoforge-wheel-smoke/bin/python -m pip install "fastapi>=0.115,<1" "uvicorn[standard]>=0.30,<1"
          /tmp/echoforge-wheel-smoke/bin/python -c "from echoforge.api.app import create_app; from echoforge.asr import build_backend_factories; assert create_app and build_backend_factories"
