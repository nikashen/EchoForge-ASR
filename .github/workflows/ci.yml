name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,serve]"
      - run: python -m pytest
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m mypy src/echoforge
      - run: python scripts/build_pages.py --output dist/pages
      - run: node --check src/echoforge/web/app.js
      - run: node --check src/echoforge/web/pcm-worklet.js
      - run: python -m compileall -q src scripts
      - run: python -m build
      - shell: bash
        run: |
          python -m venv /tmp/echoforge-wheel-smoke
          /tmp/echoforge-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/echoforge-wheel-smoke/bin/python -m pip install "fastapi>=0.115,<1" "uvicorn[standard]>=0.30,<1"
          /tmp/echoforge-wheel-smoke/bin/python -c "from echoforge.api.app import create_app; from echoforge.asr import build_backend_factories; from echoforge.evaluation import extract_aishell, prepare_aishell_manifest, run_manifest, validate_aishell_extraction; assert all((create_app, build_backend_factories, extract_aishell, prepare_aishell_manifest, run_manifest, validate_aishell_extraction))"

  windows-verifier-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,verifier]"
      - run: python -c "import importlib.metadata, platform; assert platform.system() == 'Windows'; assert importlib.metadata.version('ctranslate2') == '4.5.0'; import ctranslate2, faster_whisper; assert ctranslate2 and faster_whisper"
      - run: python -m pytest tests/test_preflight.py tests/test_adapters.py
