[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echoforge-asr"
version = "0.1.2"
description = "Evidence-first Chinese streaming ASR laboratory and self-healing transcript service"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "nika"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "scipy>=1.11,<2",
]

[project.urls]
Homepage = "https://github.com/nikashen/EchoForge-ASR"
Repository = "https://github.com/nikashen/EchoForge-ASR"
Issues = "https://github.com/nikashen/EchoForge-ASR/issues"

[project.optional-dependencies]
serve = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]
audio = [
  "soundfile>=0.12,<1",
]
streaming = [
  "sherpa-onnx==1.13.5",
]
verifier = [
  "faster-whisper==1.2.1",
  "ctranslate2==4.5.0; platform_system == 'Windows'",
]
dev = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<0.29",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "build>=1.2,<2",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "scipy-stubs==1.15.3.0; python_version < '3.11'",
  "scipy-stubs==1.17.1.5; python_version >= '3.11'",
]

[project.scripts]
echoforge = "echoforge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
echoforge = [
  "web/*.html",
  "web/*.css",
  "web/*.js",
  "web/*.svg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
files = ["src/echoforge/contracts", "src/echoforge/audio", "src/echoforge/evaluation"]
